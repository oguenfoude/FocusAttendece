name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FocusPlus.slnx -c Release

      - name: Test
        run: dotnet test tests/FocusPlus.Tests/FocusPlus.Tests.csproj -c Release --no-build

      - name: Verify GUI starts (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          timeout 20s xvfb-run -a dotnet src/FocusPlus.Desktop/bin/Release/net10.0/FocusPlus.dll
          test -f "$HOME/.local/share/FocusPlus/focus-attendance.db"
